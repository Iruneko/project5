<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations | Albuquerque Breaking Bad Tour</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="hero-overlay">
      <p class="hero-tag">BOOK YOUR TOUR</p>
      <h1>RESERVATIONS</h1>
      <p class="hero-subtitle">
        Please complete the form below to request your Albuquerque Breaking Bad tour.
      </p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="reservations.html">Reservations</a>
  </nav>

  <main class="container">
    <section class="form-section">
      <p class="section-label">TOUR BOOKING</p>
      <h2>Reservation Form</h2>

      <form target="" method="post">
        <label for="fullname">First and Last Name *</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street">

        <label for="city">City</label>
        <input type="text" id="city" name="city">

        <label for="state">State</label>
        <select id="state" name="state">
          <option value="">Select a state</option>
          <option value="NM">New Mexico</option>
          <option value="CA">California</option>
          <option value="AZ">Arizona</option>
          <option value="TX">Texas</option>
          <option value="NV">Nevada</option>
        </select>

        <label for="zipcode">Zipcode</label>
        <input type="text" id="zipcode" name="zipcode">

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">

        <label for="age">Age Range</label>
        <select id="age" name="age">
          <option value="">Select your age range</option>
          <option value="Under 18">Under 18</option>
          <option value="18-25">18-25</option>
          <option value="26-35">26-35</option>
          <option value="36-45">36-45</option>
          <option value="46-55">46-55</option>
          <option value="56+">56+</option>
        </select>

        <label for="tourdate">Date you would like to plan your reservation for</label>
        <input type="date" id="tourdate" name="tourdate">

        <label for="guests">Total amount of guests</label>
        <input type="number" id="guests" name="guests" min="1">

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <input type="submit" value="Submit">
      </form>
    </section>
  </main>

  <footer>
    <p class="footer-title">ALBUQUERQUE BREAKING BAD TOUR</p>
    <p>Thank you for your interest in booking a tour.</p>
    <p><a href="index.html">Back to Home</a></p>
  </footer>

</body>
</html>
